<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG Bookmark</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../settings/settings.css">
  <style>
    :root { --pp-w: 300px; }
    html, body { overflow: hidden; }
    body { width: var(--pp-w); padding: 0; margin: 0; }
    .pp-root {
      width: var(--pp-w);
      height: 460px;
      position: relative;
      overflow: hidden;
    }
    /* ---- Main menu view ---- */
    .pp-view {
      position: absolute;
      inset: 0;
      padding: 14px;
      display: flex;
      flex-direction: column;
      transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .2s ease;
    }
    .pp-view.hidden-shift {
      transform: translateX(-18px);
      opacity: 0;
      pointer-events: none;
    }
    .pp-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .pp-title svg { width: 18px; height: 18px; color: var(--accent); }
    .pp-list { display: flex; flex-direction: column; gap: 4px; }
    .pp-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid transparent;
      background: var(--glass);
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: all .15s ease;
    }
    .pp-item:hover { background: var(--glass-strong); border-color: var(--glass-border); }
    .pp-item svg { width: 16px; height: 16px; color: var(--text-dim); }
    .pp-item .desc { color: var(--text-faint); font-size: 11px; margin-top: 2px; }
    .pp-item > div { display: flex; flex-direction: column; }
    .pp-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.06); font-size: 11px; color: var(--text-faint); text-align: center; }

    /* ---- Settings slide-out panel ---- */
    .pp-settings {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: var(--pp-w);
      background: var(--bg-base);
      border-left: 1px solid var(--glass-border);
      box-shadow: -12px 0 30px rgba(0,0,0,.45);
      transform: translateX(100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      z-index: 5;
    }
    .pp-settings.open { transform: translateX(0); }
    .pp-settings .s-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      flex-shrink: 0;
    }
    .pp-settings .s-head h2 {
      margin: 0; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .pp-settings .s-head svg { width: 16px; height: 16px; color: var(--accent); }
    .pp-settings .s-close {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--glass-border); background: var(--glass);
      color: var(--text-dim); cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .pp-settings .s-close:hover { background: var(--glass-strong); color: var(--text); }
    .pp-settings .s-body {
      flex: 1; overflow-y: auto; padding: 4px 14px 14px;
    }
    /* Compact the settings.css form for the narrow popup */
    .pp-settings .shell {
      max-width: none; margin: 0; padding: 0;
      background: transparent; border: 0; backdrop-filter: none;
      border-radius: 0;
    }
    .pp-settings .title { display: none; }
    .pp-settings .group { padding: 14px 0; }
    .pp-settings .field { gap: 8px; }
    .pp-settings .field label:first-child { width: 84px; font-size: 12px; }
    .pp-settings .field input[type="text"],
    .pp-settings .field select,
    .pp-settings .field input[type="range"] { min-width: 0; }
    .pp-settings .footer { text-align: right; padding-top: 12px; }
    .pp-settings .btn.primary { width: 100%; justify-content: center; }
  </style>
</head>
<body>
  <div class="gg-bg" data-style="default" style="opacity:.5"></div>
  <div class="pp-root">
    <!-- Main menu -->
    <div class="pp-view" id="ppView">
      <h1 class="pp-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        GG Bookmark
      </h1>
      <div class="pp-list">
        <button class="pp-item" id="openNewtab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-3v-7H8v7H5a2 2 0 0 1-2-2z"/></svg>
          <div><span>打开起始页</span><span class="desc">在新标签打开</span></div>
        </button>
        <button class="pp-item" id="openOrganize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <div><span>整理书签</span><span class="desc">多选 · 移动 · 删除</span></div>
        </button>
        <button class="pp-item" id="openSettings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <div><span>设置</span><span class="desc">背景 · 搜索引擎 · 主题色</span></div>
        </button>
      </div>
      <div class="pp-foot">GG Bookmark v1.0</div>
    </div>

    <!-- Settings panel (slides from right) -->
    <div class="pp-settings" id="ppSettings">
      <div class="s-head">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          设置
        </h2>
        <button class="s-close" id="ppSettingsClose" title="返回">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="s-body">
        <div class="shell glass">
          <section class="group">
            <h2>背景</h2>
            <div class="field">
              <label>背景风格</label>
              <div class="seg">
                <button data-bg="default" class="seg-btn">渐变</button>
                <button data-bg="gradient" class="seg-btn">深色渐变</button>
                <button data-bg="image" class="seg-btn">自定义图片</button>
              </div>
            </div>
            <div class="field">
              <label>图片来源</label>
              <input id="bgUrl" type="text" placeholder="https://... 网络图片 URL">
              <label class="btn icon-btn" title="本地上传">
                <input type="file" id="bgFile" accept="image/*" style="display:none">
                <span style="display:inline-block;width:18px;height:18px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span>
              </label>
              <button class="btn primary" id="bgApply">应用</button>
            </div>
            <div class="preview hidden" id="bgPreview">
              <img id="previewImg" alt="预览">
              <button class="btn danger btn-sm" id="bgClear">清除</button>
            </div>
            <div class="hint">支持 JPG/PNG/WebP 链接或本地上传。选择“自定义图片”后点击“应用”。</div>
            <div class="field col">
              <label>预设壁纸</label>
              <div class="preset-grid" id="presetGrid"></div>
            </div>
            <div class="field">
              <label>模糊程度</label>
              <input id="bgBlur" type="range" min="0" max="40" step="1">
              <span class="range-val" id="bgBlurVal">0px</span>
            </div>
            <div class="field">
              <label>遮罩透明度</label>
              <input id="bgDim" type="range" min="0" max="0.85" step="0.05">
              <span class="range-val" id="bgDimVal">0.35</span>
            </div>
          </section>

          <section class="group">
            <h2>搜索</h2>
            <div class="field">
              <label>默认搜索引擎</label>
              <select id="seSelect"></select>
            </div>
          </section>

          <section class="group">
            <h2>外观</h2>
            <div class="field">
              <label>主题模式</label>
              <div class="seg">
                <button data-theme="dark" class="seg-btn theme-btn">黑暗</button>
                <button data-theme="light" class="seg-btn theme-btn">明亮</button>
              </div>
            </div>
            <div class="field">
              <label>主题色</label>
              <div class="colors" id="colors"></div>
            </div>
            <div class="field">
              <label>卡片列宽</label>
              <input id="cardWidth" type="range" min="240" max="640" step="20">
              <span class="range-val" id="cardWidthVal">320px</span>
            </div>
            <div class="field">
              <label>卡片描述</label>
              <label class="cb"><input type="checkbox" id="showDesc" checked> 显示网站描述（域名）</label>
            </div>
            <div class="field">
              <label>字体大小</label>
              <select id="fontSize">
                <option value="small">小</option>
                <option value="medium">中</option>
                <option value="large">大</option>
              </select>
            </div>
          </section>

          <section class="group">
            <h2>数据</h2>
            <div class="field col">
              <label>书签导入文件夹</label>
              <div style="display:flex; gap:10px; align-items:center; width:100%;">
                <select id="importFolderSelect" style="flex:1;"></select>
                <button class="btn ghost" id="btnClearImportFolder">清除</button>
              </div>
              <div class="hint">设置后，下次导入配置时将自动把书签导入此文件夹，不再每次手动选择。</div>
            </div>
            <div class="field actions data-ops">
              <button class="btn" id="btnExport">导出配置</button>
              <button class="btn" id="btnImport">导入配置</button>
              <input type="file" id="importFile" accept="application/json,.json" style="display:none">
              <button class="btn danger" id="btnClear">清除配置</button>
            </div>
            <div class="hint">导出为 JSON 文件备份；导入会覆盖当前设置；清除会恢复全部默认并删除本地配置。</div>
          </section>

          <div class="footer">
            <button class="btn primary" id="btnSave">保存设置</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../lib/store.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../settings/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
