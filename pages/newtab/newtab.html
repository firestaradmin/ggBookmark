<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(￣︶￣)↗ GO GO 起始页</title>
  <link rel="icon" href="../../icons/GGBookmarkLOGO.ico">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../settings/settings.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="gg-bg" data-style="default"></div>

  <!-- Header -->
  <header class="topbar">
    <div class="cats" id="catsBar" aria-label="分类"></div>

    <div class="searchwrap glass">
      <span class="se-icon" id="seIcon" title="切换搜索引擎"></span>
      <input id="searchInput" type="text" placeholder="搜索..." autofocus autocomplete="off" spellcheck="false">
      <button class="se-go btn primary" id="seGo" title="搜索">搜索</button>
      <div class="menu glass" id="seMenu"></div>
    </div>

    <div class="actions">
      <button class="btn icon-btn" id="btnUndo" title="撤回" disabled></button>
      <div class="view-menu-wrap">
        <button class="btn icon-btn" id="btnView" title="显示设置：紧凑模式与卡片高度"></button>
        <div class="menu glass view-menu" id="viewMenu">
          <div class="view-group">
            <div class="view-group-title">紧凑模式（所有卡片）</div>
            <button class="menu-item" data-view="compact" data-val="auto"><span class="dot"></span><span>自动</span></button>
            <button class="menu-item" data-view="compact" data-val="on"><span class="dot"></span><span>固定开启</span></button>
            <button class="menu-item" data-view="compact" data-val="off"><span class="dot"></span><span>固定关闭</span></button>
          </div>
          <div class="view-group">
            <div class="view-group-title">卡片高度（所有卡片）</div>
            <button class="menu-item" data-view="fit" data-val="auto"><span class="dot"></span><span>自适应高度</span></button>
            <button class="menu-item" data-view="fit" data-val="fixed"><span class="dot"></span><span>固定高度</span></button>
          </div>
        </div>
      </div>
      <button class="btn icon-btn" id="btnOrganize" title="整理书签"></button>
      <button class="btn icon-btn" id="btnSettings" title="设置"></button>
      <button class="btn icon-btn" id="btnAddCard" title="卡片添加：添加一个分类卡片"></button>
    </div>
  </header>

  <!-- Scroll wrapper: real scroll container so custom scrollbars apply on
       both Firefox and Chrome/Windows (root scroller ignores them). -->
  <div class="scroll" id="scroll">
    <!-- Grid -->
    <main class="canvas">
      <div class="grid" id="grid" data-empty="false">
        <div class="grid-empty">
          <div class="empty-icon"></div>
          <p>还没有卡片</p>
          <p class="sub">点击右上角“卡片添加”，选择一个书签文件夹来生成卡片。</p>
        </div>
      </div>
    </main>
  </div>

  <footer class="app-footer">@firestaradmin</footer>

  <!-- Template -->
  <template id="bookmarkTileTpl">
    <li class="tile" draggable="false">
      <div class="tile-icon" data-action="open"></div>
      <div class="tile-body" data-action="open">
        <div class="tile-title"></div>
        <div class="tile-desc"></div>
      </div>
      <div class="tile-more" tabindex="0" role="button" title="拖动" draggable="true"></div>
    </li>
  </template>

  <template id="cardTpl">
    <section class="card" data-folder-id="">
      <header class="card-head">
        <span class="card-drag" draggable="true" title="拖动标题可调整分类顺序"></span>
        <h2 class="card-title"></h2>
        <button class="card-compact btn icon-btn" title="紧凑模式"></button>
        <button class="card-fit btn icon-btn" title="自动适应：根据子项数量调整高度"></button>
        <button class="card-more btn icon-btn" title="卡片设置"></button>
        <div class="card-menu menu glass"></div>
      </header>
      <ul class="card-body"></ul>
      <div class="card-resize" title="拖动右下角调整卡片大小"></div>
    </section>
  </template>

  <!-- Settings slide-out panel -->
  <aside class="nt-settings" id="ntSettings">
    <div class="s-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </h2>
      <button class="s-close" id="ntSettingsClose" title="返回">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="s-body">
      <div class="shell glass">
        <section class="group">
          <h2>背景</h2>
          <div class="field">
            <label>背景风格</label>
            <div class="seg">
              <button data-bg="default" class="seg-btn">渐变</button>
              <button data-bg="gradient" class="seg-btn">深色渐变</button>
              <button data-bg="preset" class="seg-btn">预设壁纸</button>
              <button data-bg="image" class="seg-btn">自定义图片</button>
            </div>
          </div>
          <div class="field" id="imageSourceField">
            <label>图片来源</label>
            <input id="bgUrl" type="text" placeholder="https://... 网络图片 URL">
            <label class="btn icon-btn" title="本地上传">
              <input type="file" id="bgFile" accept="image/*" style="display:none">
              <span style="display:inline-block;width:18px;height:18px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span>
            </label>
            <button class="btn primary" id="bgApply">应用</button>
          </div>
          <div class="preview hidden" id="bgPreview">
            <img id="previewImg" alt="预览">
            <button class="btn danger btn-sm" id="bgClear">清除</button>
          </div>
          <div class="field col" id="presetField">
            <label>预设壁纸</label>
            <div class="preset-grid" id="presetGrid"></div>
          </div>
          <div class="hint" id="bgHint">选择“自定义图片”或“预设壁纸”后，点击下方缩略图即可应用。</div>
          <div class="field">
            <label>模糊程度</label>
            <input id="bgBlur" type="range" min="0" max="40" step="1">
            <span class="range-val" id="bgBlurVal">0px</span>
          </div>
          <div class="field">
            <label>遮罩透明度</label>
            <input id="bgDim" type="range" min="0" max="0.85" step="0.05">
            <span class="range-val" id="bgDimVal">0.35</span>
          </div>
        </section>

        <section class="group">
          <h2>搜索</h2>
          <div class="field">
            <label>默认搜索引擎</label>
            <select id="seSelect"></select>
          </div>
        </section>

        <section class="group">
          <h2>外观</h2>
          <div class="field">
            <label>主题色</label>
            <div class="colors" id="colors"></div>
          </div>
          <div class="field">
            <label>卡片列宽</label>
            <input id="cardWidth" type="range" min="240" max="640" step="20">
            <span class="range-val" id="cardWidthVal">320px</span>
          </div>
          <div class="field">
            <label>卡片描述</label>
            <label class="cb"><input type="checkbox" id="showDesc" checked> 显示网站描述（域名）</label>
          </div>
          <div class="field">
            <label>字体大小</label>
            <select id="fontSize">
              <option value="small">小</option>
              <option value="medium">中</option>
              <option value="large">大</option>
            </select>
          </div>
        </section>

          <section class="group">
            <h2>数据</h2>
            <div class="field col">
              <label>书签导入文件夹</label>
              <div style="display:flex; gap:10px; align-items:center; width:100%;">
                <select id="importFolderSelect" style="flex:1;"></select>
                <button class="btn ghost" id="btnClearImportFolder">清除</button>
              </div>
              <div class="hint">设置后，下次导入配置时将自动把书签导入此文件夹，不再每次手动选择。</div>
            </div>
            <div class="field actions">
              <button class="btn" id="btnResetBg">重置背景</button>
            </div>
            <div class="field actions data-ops">
              <button class="btn" id="btnExport">导出配置</button>
              <button class="btn" id="btnImport">导入配置</button>
              <input type="file" id="importFile" accept="application/json,.json" style="display:none">
              <button class="btn danger" id="btnClear">清除配置</button>
            </div>
            <div class="hint">导出为 JSON 文件备份；导入会覆盖当前设置；清除会恢复全部默认并删除本地配置。</div>
          </section>

        <div class="footer">
          <button class="btn primary" id="btnSave">保存设置</button>
        </div>
      </div>
    </div>
  </aside>

  <div id="folderPickerWrap" class="overlay hidden">
    <div class="picker glass">
      <div class="picker-head">
        <h3 id="pickerTitle">选择书签文件夹</h3>
        <button class="btn icon-btn" id="pickerClose">✕</button>
      </div>
      <div class="picker-tree" id="pickerTree"></div>
      <div class="picker-foot">
        <label class="cb"><input type="checkbox" id="pickerRecursive"> 包含子文件夹</label>
        <button class="btn primary" id="pickerConfirm">确认</button>
      </div>
    </div>
  </div>

  <script src="../../lib/store.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../settings/settings.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
