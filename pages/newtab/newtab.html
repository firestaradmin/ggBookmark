<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG 起始页</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="gg-bg" data-style="default"></div>

  <!-- Header -->
  <header class="topbar">
    <div class="cats" id="catsBar" aria-label="分类"></div>

    <div class="searchwrap glass">
      <span class="se-icon" id="seIcon" title="切换搜索引擎"></span>
      <input id="searchInput" type="text" placeholder="搜索..." autofocus autocomplete="off" spellcheck="false">
      <button class="se-go btn primary" id="seGo" title="搜索">搜索</button>
      <div class="menu glass" id="seMenu"></div>
    </div>

    <div class="actions">
      <button class="btn icon-btn" id="btnUndo" title="撤回" disabled></button>
      <div class="view-menu-wrap">
        <button class="btn icon-btn" id="btnView" title="显示设置：紧凑模式与卡片高度"></button>
        <div class="menu glass view-menu" id="viewMenu">
          <div class="view-group">
            <div class="view-group-title">紧凑模式（所有卡片）</div>
            <button class="menu-item" data-view="compact" data-val="auto"><span class="dot"></span><span>自动</span></button>
            <button class="menu-item" data-view="compact" data-val="on"><span class="dot"></span><span>固定开启</span></button>
            <button class="menu-item" data-view="compact" data-val="off"><span class="dot"></span><span>固定关闭</span></button>
          </div>
          <div class="view-group">
            <div class="view-group-title">卡片高度（所有卡片）</div>
            <button class="menu-item" data-view="fit" data-val="auto"><span class="dot"></span><span>自适应高度</span></button>
            <button class="menu-item" data-view="fit" data-val="fixed"><span class="dot"></span><span>固定高度</span></button>
          </div>
        </div>
      </div>
      <button class="btn icon-btn" id="btnOrganize" title="整理书签"></button>
      <button class="btn icon-btn" id="btnSettings" title="设置"></button>
      <button class="btn icon-btn" id="btnAddCard" title="卡片添加：添加一个分类卡片"></button>
    </div>
  </header>

  <!-- Scroll wrapper: real scroll container so custom scrollbars apply on
       both Firefox and Chrome/Windows (root scroller ignores them). -->
  <div class="scroll" id="scroll">
    <!-- Grid -->
    <main class="canvas">
      <div class="grid" id="grid" data-empty="false">
        <div class="grid-empty">
          <div class="empty-icon"></div>
          <p>还没有卡片</p>
          <p class="sub">点击右上角“卡片添加”，选择一个书签文件夹来生成卡片。</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Template -->
  <template id="bookmarkTileTpl">
    <li class="tile" draggable="false">
      <div class="tile-icon" data-action="open"></div>
      <div class="tile-body" data-action="open">
        <div class="tile-title"></div>
        <div class="tile-desc"></div>
      </div>
      <div class="tile-more" tabindex="0" role="button" title="拖动" draggable="true"></div>
    </li>
  </template>

  <template id="cardTpl">
    <section class="card" data-folder-id="">
      <header class="card-head">
        <span class="card-drag" draggable="true" title="拖动标题可调整分类顺序"></span>
        <h2 class="card-title"></h2>
        <button class="card-compact btn icon-btn" title="紧凑模式"></button>
        <button class="card-fit btn icon-btn" title="自动适应：根据子项数量调整高度"></button>
        <button class="card-more btn icon-btn" title="卡片设置"></button>
        <div class="card-menu menu glass"></div>
      </header>
      <ul class="card-body"></ul>
      <div class="card-resize" title="拖动右下角调整卡片大小"></div>
    </section>
  </template>

  <div id="folderPickerWrap" class="overlay hidden">
    <div class="picker glass">
      <div class="picker-head">
        <h3 id="pickerTitle">选择书签文件夹</h3>
        <button class="btn icon-btn" id="pickerClose">✕</button>
      </div>
      <div class="picker-tree" id="pickerTree"></div>
      <div class="picker-foot">
        <label class="cb"><input type="checkbox" id="pickerRecursive"> 包含子文件夹</label>
        <button class="btn primary" id="pickerConfirm">确认</button>
      </div>
    </div>
  </div>

  <script src="../../lib/store.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
