<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>整理书签</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="organizer.css">
</head>
<body>
  <div class="gg-bg" data-style="default"></div>

  <header class="topbar">
    <div class="brand">
      <h1>整理书签</h1>
      <button class="btn icon-btn" id="btnHome" data-tip="返回起始页"></button>
    </div>
    <div class="toolbar">
      <button class="btn icon-btn" id="btnUndo" data-tip="撤回" disabled></button>
      <button class="btn icon-btn" id="btnDelete" data-tip="删除选中" disabled></button>
      <div class="col-toggle" id="colToggle" data-tip="面板书签列数">
        <button class="col-btn active" data-col="1">1</button>
        <button class="col-btn" data-col="2">2</button>
        <button class="col-btn" data-col="3">3</button>
        <button class="col-btn" data-col="4">4</button>
      </div>
      <div class="selected-info-pill" id="selectedInfo">未选中</div>
    </div>
  </header>

  <main class="layout">
    <!-- Folder tree (left) -->
    <aside class="pane folders glass">
      <div class="pane-title">
        <span>文件夹</span>
        <div class="btn-group">
          <button class="btn icon-btn" id="btnCollapseAll" data-tip="全部折叠"></button>
          <button class="btn icon-btn" id="btnNewFolder" data-tip="新建文件夹"></button>
        </div>
      </div>
      <div id="folderTree" class="folder-tree"></div>
    </aside>

    <!-- Content (right): tabbed multi-panel comparison -->
    <section class="pane content glass">
      <div class="panel-tabs" id="panelTabs"></div>
      <div class="panels" id="panels"></div>
    </section>
  </main>

  <template id="bookmarkItemTpl">
    <div class="item" draggable="true">
      <div class="item-check"></div>
      <div class="item-icon"></div>
      <div class="item-info">
        <div class="item-title"></div>
        <div class="item-url"></div>
      </div>
      <div class="item-type"></div>
    </div>
  </template>

  <!-- Move-to menu -->
  <div class="menu glass" id="moveMenu"></div>

  <!-- Generic right-click context menu -->
  <div class="menu glass" id="ctxMenu"></div>

  <script src="../../lib/browser.js"></script>
  <script src="../../lib/store.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="organizer.js"></script>
</body>
</html>
