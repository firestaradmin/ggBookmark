<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG 设置</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body contextmenu="return false">
  <div class="gg-bg" data-style="default"></div>

  <div class="shell glass">
    <h1 class="title">GG 设置</h1>

    <section class="group">
      <h2>背景</h2>
      <div class="field">
        <label>背景风格</label>
        <div class="seg">
          <button data-bg="default" class="seg-btn">渐变</button>
          <button data-bg="gradient" class="seg-btn">深色渐变</button>
          <button data-bg="image" class="seg-btn">自定义图片</button>
        </div>
      </div>
      <div class="field">
        <label>图片来源</label>
        <input id="bgUrl" type="text" placeholder="https://... 网络图片 URL">
        <label class="btn icon-btn" title="本地上传">
          <input type="file" id="bgFile" accept="image/*" style="display:none">
          <span style="display:inline-block;width:18px;height:18px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span>
        </label>
        <button class="btn primary" id="bgApply">应用</button>
      </div>
      <div class="preview hidden" id="bgPreview">
        <img id="previewImg" alt="预览">
        <button class="btn danger btn-sm" id="bgClear">清除</button>
      </div>
      <div class="hint">支持 JPG/PNG/WebP 链接或本地上传（本地文件会转为数据链接加载，避免跨源限制）。<br>选择“自定义图片”风格后点击“应用”。</div>
      <div class="field">
        <label>模糊程度</label>
        <input id="bgBlur" type="range" min="0" max="40" step="1">
        <span class="range-val" id="bgBlurVal">0px</span>
      </div>
      <div class="field">
        <label>遮罩透明度</label>
        <input id="bgDim" type="range" min="0" max="0.85" step="0.05">
        <span class="range-val" id="bgDimVal">0.35</span>
      </div>
    </section>

    <section class="group">
      <h2>搜索</h2>
      <div class="field">
        <label>默认搜索引擎</label>
        <select id="seSelect"></select>
      </div>
    </section>

    <section class="group">
      <h2>外观</h2>
      <div class="field">
        <label>主题色</label>
        <div class="colors" id="colors"></div>
      </div>
      <div class="field">
        <label>卡片列宽</label>
        <input id="cardWidth" type="range" min="240" max="640" step="20">
        <span class="range-val" id="cardWidthVal">320px</span>
      </div>
      <div class="field">
        <label>卡片描述</label>
        <label class="cb"><input type="checkbox" id="showDesc" checked> 显示网站描述（域名）</label>
      </div>
      <div class="field">
        <label>字体大小</label>
        <select id="fontSize">
          <option value="small">小</option>
          <option value="medium">中</option>
          <option value="large">大</option>
        </select>
      </div>
    </section>

    <section class="group">
      <h2>数据</h2>
      <div class="field actions">
        <button class="btn" id="btnResetBg">重置背景</button>
      </div>
      <div class="hint">分类与卡片配置均保存在本地，可一直调整。<br>书签本身保存在 Firefox 的“整理书签”页面中管理。</div>
    </section>

    <div class="footer">
      <button class="btn primary" id="btnSave">保存设置</button>
    </div>
  </div>

  <script src="../../lib/store.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="settings.js"></script>
</body>
</html>
